[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/piano/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Aislamiento entre orígenes: permite que la IA use varios hilos (SharedArrayBuffer).
# Todo lo que carga la página es del mismo dominio, así que no rompe nada.
[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"

[[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
